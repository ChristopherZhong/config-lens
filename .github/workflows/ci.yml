name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_call:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build check
        run: npm run build
